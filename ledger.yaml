  INV-2: {gate_test_status: covered}
  INV-3: {gate_test_status: covered}
  INV-4: {gate_test_status: covered}
  INV-5: {gate_test_status: covered}
  INV-6: {gate_test_status: covered}    # was omitted entirely until 2026-07-30 (dispatch-telemetry-consolidation
                                         # CR-11) despite Phases A/B/E/F all depending on it; reconciled, not a
                                         # resolutions: entry — no historical-recurrence dismissal made here.
resolutions:
  INV-1:
    resolved_at_date: "2026-07-30"
    note: >
      Historical recurrence (4 tagged HISTORY entries, 2026-07-21 to 2026-07-26) mixed one
      genuine violation with three adjacent/non-breach entries. The genuine one — a literal
      host bind mount (-v /tmp/switchyard-work:/work) on the agent container — was removed;
      tests/no-host-rights.test.mjs proves no working container carries a host bind mount. The
      other three: an approved, documented sandbox posture (codex's
      --dangerously-bypass-approvals-and-sandbox, required because nested unprivileged userns
      is disallowed under Docker/OrbStack — the working container remains the containment
      boundary), a working-container filesystem bug whose own fix note says "INV-1 intact", and
      a stale-docs correction. Resolved by David 2026-07-30.
  INV-2:
    resolved_at_date: "2026-07-30"
    note: >
      Historical recurrence (5 tagged HISTORY entries, 2026-07-21 to 2026-07-26) included two
      genuine, serious gate-bypass bugs: a CRITICAL non-ASCII/quoted-path bypass of the
      sensitive-path filter (secrets reproducibly written to disk pre-fix) and a naive
      content-substring blocklist trivially evaded by e.g. a malicious package.json script. Both
      were fixed by rewriting validateDiff/applyReviewedDiff to parse diffs structurally via
      `git apply --numstat`/`--summary` instead of scanning text, with regression tests
      reproducing both exploits and confirming they fail closed post-fix
      (tests/integration-gate.test.mjs). The other three tagged entries were tangential (a
      write-blocked-before-reaching-the-gate bug, a dual-tagged sandbox-posture entry, a
      missing-import crash) rather than gate bypasses. Resolved by David 2026-07-30.
                          # INV-x: {resolved_at_date: "YYYY-MM-DD", note: "..."}
  INV-4:
    resolved_at_date: "2026-08-04"
    note: >
      Consolidation checkpoint: the pre-2026-08-04 recurrence window was reviewed and the
      capability/selection/provenance contract is covered by the router, runner, ledger,
      checkpoint, status, result, and quota capstone tests. The adapter accepts only verified
      provider-scoped quota signatures; the runner quarantines an exact owned-container target
      for one same-task retry after reset, while generic/auth/unknown failures remain terminal.
      No live quota was spent to manufacture exhaustion, and standing-container credentials
      were not treated as equivalent to host-side provider evidence.
  INV-5:
    resolved_at_date: "2026-08-04"
    note: >
      Consolidation checkpoint: the pre-2026-08-04 terminology and capability-contract
      recurrence window was reviewed. RequiredCapability remains the hard eligibility filter
      and the parser/selection and quota capstones cover the contract without weakening
      capability filtering during retry.
  INV-6:
    resolved_at_date: "2026-08-04"
    note: >
      The quota capstone extends the existing durable-run contract: checkpoint retry state is
      authoritative, transitions are monotonic and atomically persisted, exact target quarantine
      survives resume, reset precedes reroute, and detached status/result reconcile the derived
      projection. Caller-owned containers and the untrusted orchestrator path fail closed.
